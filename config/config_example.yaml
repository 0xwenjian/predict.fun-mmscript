# Solo Market 配置模板
# 复制此文件为 account_1.config.yaml 并修改

solo_market:
  # 市场列表 — 支持市场 URL / slug / market_id
  markets:
    - "https://predict.fun/market/will-polymarket-launch-their-official-token-by"

  # 多选市场的英文选项名
  # 二元 YES/NO 市场可以直接写 YES 或 NO
  option: "December 31, 2026"

  # 买 YES 还是买 NO
  YON: "YES"

  # 每次挂单的固定份额数量
  order_shares: 101

  # 首次下单/重挂目标价 = BestAsk - 该偏移（单位：美分）
  target_offset_cents: 2.0

  # 存活区间下限 = BestAsk - 该偏移（单位：美分）
  lower_bound_offset_cents: 3.5

  # 存活区间上限 = BestAsk - 该偏移（单位：美分）
  upper_bound_offset_cents: 1.3

  # 检查间隔（秒）
  check_interval_seconds: 30


# Telegram 通知 (每 2 小时发送状态报告)
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

# 代理
proxy:
  enabled: false
  http: "http://127.0.0.1:7890"
  https: "http://127.0.0.1:7890"
